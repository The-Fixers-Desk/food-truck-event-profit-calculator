<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      {% block title %}Food Truck Event Profit Calculator{% endblock %}
    </title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
  </head>

  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="app-header__content">
          <a class="wordmark" href="{{ url_for('main.home') }}">
            Food Truck Event Profit Calculator
          </a>
        </div>
      </header>

      <nav class="app-navigation" aria-label="Primary navigation">
        <div class="app-navigation__content">
          {% if business_defaults_setup_complete %}
            <a data-discard-navigation
              class="nav-link {% if active_page == 'dashboard' %}nav-link--active{% endif %}"
              href="{{ url_for('main.dashboard') }}">Dashboard</a>
            <a data-discard-navigation
              class="nav-link {% if active_page == 'calculator' %}nav-link--active{% endif %}"
              href="{{ url_for('main.calculator') }}">Analyze new event</a>
            <a data-discard-navigation
              class="nav-link {% if active_page == 'saved_events' %}nav-link--active{% endif %}"
              href="{{ url_for('main.saved_events') }}">Saved events</a>
            <a data-discard-navigation class="nav-link"
              href="{{ url_for('main.saved_events') }}#comparison-selection-form">
              Compare scenarios
            </a>
            <a data-discard-navigation
              class="nav-link {% if active_page == 'defaults' %}nav-link--active{% endif %}"
              href="{{ url_for('main.defaults') }}">Business defaults</a>
          {% else %}
            <a class="nav-link {% if active_page == 'welcome' %}nav-link--active{% endif %}"
              href="{{ url_for('main.welcome') }}">Welcome</a>
            <a class="nav-link {% if active_page == 'defaults' %}nav-link--active{% endif %}"
              href="{{ url_for('main.defaults') }}">Business defaults</a>
          {% endif %}
        </div>
      </nav>

      <main class="app-main">{% block content %}{% endblock %}</main>
    </div>
  </body>
</html>
